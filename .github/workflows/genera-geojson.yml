name: Genera GeoJSON dei cammini

on:
  workflow_dispatch:          # pulsante "Run workflow" nella scheda Actions
    inputs:
      ids:
        description: "ID relazioni OSM da aggiungere (opzionale, separati da virgola)"
        required: false
        default: ""
      tentativo:
        description: "Numero del tentativo (lo imposta da solo il workflow quando si rilancia; lascia 1)"
        required: false
        default: "1"
  schedule:
    - cron: "0 4 1 * *"       # aggiornamento automatico il 1° di ogni mese

permissions:
  contents: write
  actions: write              # serve per rilanciarsi da solo

# una sola corsa alla volta: la corsa che si rilancia da sola aspetta che questa finisca
concurrency:
  group: genera-geojson
  cancel-in-progress: false

env:
  MAX_TENTATIVI: "8"          # dopo tanti tentativi smette di rilanciarsi (evita cicli infiniti)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scarica i cammini da OpenStreetMap
        id: build
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: python3 scripts/build_geojson.py --ids "$IDS"
      - name: Copia dei dati come allegato (sicurezza)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dati-cammini
          path: data/
          if-no-files-found: warn
      - name: Salva nel repository
        if: always()
        run: |
          set -u
          echo "--- contenuto di data/ ---"; ls -la data || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nessuna modifica rispetto al repository: niente da salvare."
            exit 0
          fi
          git status --short | head -20
          git commit -m "Aggiorna dati dei cammini"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then echo "Salvato nel repository."; exit 0; fi
            echo "Push rifiutato (tentativo $i): il repository è cambiato, rifaccio il commit sopra l'ultima versione."
            git fetch origin "${GITHUB_REF_NAME}"
            rm -rf /tmp/nuovidati && cp -r data /tmp/nuovidati
            git reset --hard "origin/${GITHUB_REF_NAME}"
            rm -rf data && cp -r /tmp/nuovidati data
            git add -A data
            git diff --cached --quiet && { echo "Già aggiornato."; exit 0; }
            git commit -m "Aggiorna dati dei cammini"
            sleep 5
          done
          echo "ERRORE: impossibile salvare nel repository." >&2
          exit 1
      # Se lo script non ha finito (tempo scaduto, server OSM che non rispondono, cammini saltati)
      # il workflow si rilancia da solo: riparte da quanto è già stato salvato qui sopra.
      - name: Rilancia se il lavoro non è finito
        if: always() && steps.build.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ github.event.inputs.ids }}
          TENTATIVO: ${{ github.event.inputs.tentativo }}
        run: |
          n="${TENTATIVO:-1}"
          if [ "$n" -ge "$MAX_TENTATIVI" ]; then
            echo "Raggiunti $MAX_TENTATIVI tentativi senza finire: mi fermo. Controlla i log e rilancia a mano." >&2
            exit 1
          fi
          next=$((n + 1))
          echo "Lavoro non finito: rilancio il workflow (tentativo $next di $MAX_TENTATIVI)."
          gh workflow run "${{ github.workflow }}" --ref "$GITHUB_REF_NAME" -f ids="$IDS" -f tentativo="$next"