name: Genera GeoJSON dei cammini

on:
  workflow_dispatch:          # pulsante "Run workflow" nella scheda Actions
    inputs:
      ids:
        description: "ID relazioni OSM da aggiungere (opzionale, separati da virgola)"
        required: false
        default: ""
  schedule:
    - cron: "0 4 1 * *"       # aggiornamento automatico il 1° di ogni mese

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scarica i cammini da OpenStreetMap
        run: python3 scripts/build_geojson.py --ids "${{ github.event.inputs.ids }}"
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna dati dei cammini"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              echo "Tentativo $i fallito, riprovo…"; sleep 5
            done
          fi